name: PR checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pr-build:
    name: PR build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/check.sh build
  pr-types:
    name: PR type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/check.sh types
