name: PR checks
on:
  pull_request:
  # A back-merge PR opened by the workflow token starts no PR run, so main's commits carry their own checks.
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pr-build:
    name: PR build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/check.sh build
  pr-types:
    name: PR type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/check.sh types
