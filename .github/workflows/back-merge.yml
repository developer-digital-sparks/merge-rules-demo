name: Back-merge main
on:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
  actions: write
concurrency:
  group: back-merge
  cancel-in-progress: false
jobs:
  back-merge:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open a PR if main holds something staging lacks
        run: |
          git fetch -q origin staging
          staging_tree=$(git rev-parse 'origin/staging^{tree}')
          if result=$(git merge-tree --write-tree origin/staging origin/main); then
            if [ "$result" = "$staging_tree" ]; then
              echo "Nothing to bring back."
              exit 0
            fi
          else
            echo "Merge has conflicts; the PR will show them."
          fi
          if [ -z "$(gh pr list --base staging --head main --state open --json number --jq '.[].number')" ]; then
            gh pr create --base staging --head main \
              --title "Back-merge main into staging" \
              --body "Brings main's changes back into staging. Use **Create a merge commit**, not squash."
          fi
          # A PR opened with this token doesn't start PR checks, so start them on main's commit.
          gh workflow run pr-checks.yml --ref main
